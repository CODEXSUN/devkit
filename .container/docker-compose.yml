name: devkit

x-api-env: &api-env
  NODE_ENV: production
  CODEXSUN_ALLOW_MISSING_ENV: "1"
  DEVKIT_API_PORT: ${DEVKIT_API_PORT:-7030}
  DEVKIT_WEB_PORT: ${DEVKIT_WEB_PORT:-7040}
  DEVKIT_WEB_ORIGIN: ${DEVKIT_WEB_ORIGIN:-https://devkit.codexsun.com}
  DEVKIT_COOKIE_SECRET: ${DEVKIT_COOKIE_SECRET:?DEVKIT_COOKIE_SECRET is required}
  JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
  DB_HOST: ${DB_HOST:-cxapp-mariadb}
  DB_PORT: 3306
  DB_USER: ${DB_USER:-cxapp_app}
  DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
  DEVKIT_DB_NAME: ${DEVKIT_DB_NAME:-devkit_db}
  DEVKIT_STORAGE_PATH: /storage

services:
  devkit-migrate:
    build:
      context: ../..
      dockerfile: devkit/.container/Dockerfile.api
      args:
        NODE_RUNTIME_VERSION: ${NODE_RUNTIME_VERSION:-26.5.0}
        NPM_RUNTIME_VERSION: ${NPM_RUNTIME_VERSION:-12.0.1}
    image: ${DEVKIT_IMAGE_REGISTRY:-devkit}/devkit-api:${DEVKIT_VERSION:-1.0.46}
    profiles: [tools]
    environment: *api-env
    command: ["sh", "-c", "npm run db:migrate && npm run db:seed"]
    volumes: ["devkit-data:/storage"]
    networks: [backend]

  devkit-api:
    build:
      context: ../..
      dockerfile: devkit/.container/Dockerfile.api
      args:
        NODE_RUNTIME_VERSION: ${NODE_RUNTIME_VERSION:-26.5.0}
        NPM_RUNTIME_VERSION: ${NPM_RUNTIME_VERSION:-12.0.1}
    image: ${DEVKIT_IMAGE_REGISTRY:-devkit}/devkit-api:${DEVKIT_VERSION:-1.0.46}
    container_name: devkit-api
    restart: unless-stopped
    environment: *api-env
    ports:
      - "${DEVKIT_BIND_ADDRESS:-127.0.0.1}:${DEVKIT_API_HOST_PORT:-17030}:${DEVKIT_API_PORT:-7030}"
    volumes: ["devkit-data:/storage"]
    networks: [backend]

  devkit-web:
    build:
      context: ../..
      dockerfile: devkit/.container/Dockerfile.web
      args:
        NODE_RUNTIME_VERSION: ${NODE_RUNTIME_VERSION:-26.5.0}
        NPM_RUNTIME_VERSION: ${NPM_RUNTIME_VERSION:-12.0.1}
        DEVKIT_VERSION: ${DEVKIT_VERSION:-1.0.46}
    image: ${DEVKIT_IMAGE_REGISTRY:-devkit}/devkit-web:${DEVKIT_VERSION:-1.0.46}
    container_name: devkit-web
    restart: unless-stopped
    depends_on:
      devkit-api: { condition: service_healthy }
    ports:
      - "${DEVKIT_BIND_ADDRESS:-127.0.0.1}:${DEVKIT_WEB_HOST_PORT:-17040}:80"
    networks: [backend, edge]

volumes:
  devkit-data:
    name: ${DEVKIT_DATA_VOLUME:-devkit-data}

networks:
  backend:
    name: ${CODEXSUN_BACKEND_NETWORK:-cxapp-network}
    external: true
  edge:
    name: ${CODEXSUN_EDGE_NETWORK:-cxapp-edge}
    external: true
