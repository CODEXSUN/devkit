<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <title>DevKit</title>
    <script>
      document.documentElement.dataset.theme = "light";
      document.documentElement.style.colorScheme = "light";
    </script>
    <style>
      #startup-loader {
        align-items: center;
        background: #ffffff;
        color: #171717;
        display: flex;
        flex-direction: column;
        font-family: Inter, ui-sans-serif, system-ui, sans-serif;
        gap: 16px;
        inset: 0;
        justify-content: center;
        position: fixed;
        transition:
          opacity 160ms ease,
          visibility 160ms ease;
        z-index: 9999;
      }
      #startup-loader[data-state="ready"] {
        opacity: 0;
        visibility: hidden;
      }
      .startup-loader__mark {
        align-items: center;
        background: #ffffff;
        border: 1px solid #e5e5e0;
        border-radius: 14px;
        display: flex;
        height: 64px;
        justify-content: center;
        width: 64px;
      }
      .startup-loader__mark img {
        display: block;
        height: 42px;
        object-fit: contain;
        width: 50px;
      }
      .startup-loader__title {
        font-size: 17px;
        font-weight: 650;
      }
      .startup-loader__status {
        color: #737373;
        font-size: 13px;
        margin-top: -8px;
      }
      .startup-loader__progress {
        background: #e5e5e5;
        border-radius: 99px;
        height: 3px;
        overflow: hidden;
        width: 144px;
      }
      .startup-loader__progress::after {
        animation: startup-loader-progress 1.1s ease-in-out infinite;
        background: #4c91ff;
        border-radius: inherit;
        content: "";
        display: block;
        height: 100%;
        transform: translateX(-100%);
        width: 60%;
      }
      @keyframes startup-loader-progress {
        to {
          transform: translateX(180%);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #startup-loader {
          transition: none;
        }
        .startup-loader__progress::after {
          animation: none;
          transform: translateX(35%);
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="startup-loader" role="status" aria-live="polite" aria-label="Starting DevKit">
      <div class="startup-loader__mark" aria-hidden="true">
        <img src="/assets/logo.svg" alt="" />
      </div>
      <div class="startup-loader__title">DevKit</div>
      <div class="startup-loader__status">Connecting your workspace</div>
      <div class="startup-loader__progress" aria-hidden="true"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
