services:
  cxapp-api:
    environment:
      APP_MODE: tenant
      STACK: devkit
      TENANT_ID: codexsun
      DEVKIT_SYNC_ROLE: cloud
      DEVKIT_SYNC_INSTANCE_ID: codexsun-cloud
      DEVKIT_SYNC_TOKEN_PEPPER: ${DEVKIT_SYNC_TOKEN_PEPPER:?DEVKIT_SYNC_TOKEN_PEPPER is required}
      DEVKIT_SYNC_ENCRYPTION_KEY: ${DEVKIT_SYNC_ENCRYPTION_KEY:?DEVKIT_SYNC_ENCRYPTION_KEY is required}
      DEVKIT_STORAGE_PATH: /data/devkit

  cxapp-edge:
    image: caddy:2.10-alpine
    depends_on:
      cxapp-api:
        condition: service_healthy
      cxapp-web:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - devkit-caddy-data:/data
      - devkit-caddy-config:/config
    networks:
      - backend
      - edge
    restart: unless-stopped

volumes:
  devkit-caddy-data:
  devkit-caddy-config:

